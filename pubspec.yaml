name: scannerpro
description: "Universal Flutter Scanner Pro SDK (francis2408/scanner_pro) with real-time REST API lookup, ML Kit vision AI, and multi-document parsing."
repository: https://github.com/francis2408/scanner_pro
homepage: https://github.com/francis2408/scanner_pro

version: 1.3.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: '>=0.19.0 <0.21.0'
  camera: '>=0.11.0 <0.13.0'
  google_mlkit_commons: '>=0.9.0 <0.13.0'
  image_picker: '>=1.1.2 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
