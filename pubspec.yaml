name: scannerpro
description: "Universal Flutter scanning SDK with 18 Vision AI modes, offline OCR, MICR/MRZ/VIN parsers, image compression, encrypted storage, cloud sync, and PDF export."
repository: https://github.com/francis2408/scanner_pro
homepage: https://github.com/francis2408/scanner_pro

version: 2.5.2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: '>=0.19.0 <0.21.0'
  camera: '>=0.11.0 <0.13.0'
  google_mlkit_barcode_scanning: '>=0.13.0 <0.15.0'
  google_mlkit_face_detection: '>=0.11.0 <0.13.0'
  google_mlkit_text_recognition: '>=0.14.0 <0.16.0'
  image_picker: '>=1.1.2 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
